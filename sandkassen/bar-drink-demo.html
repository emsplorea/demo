  function validateDrink(d) {
    if(!d.name.trim()) return &#x27;Drinken må ha et navn.&#x27;;

    const labels=new Set();
    for(const v of d.variants) {
      if(!v.label.trim()) return &#x27;Hver variant må ha et navn.&#x27;;
      if(labels.has(v.label.trim().toLowerCase())) return &#x27;Variantene må ha ulike navn.&#x27;;
      labels.add(v.label.trim().toLowerCase());
      if(!(num(v.price)&gt;0)) return &#x27;Salgsprisen må være større enn 0.&#x27;;
      if(!v.recipe.some(enabled)) return &#x27;Hver variant må ha minst én ingrediens.&#x27;;
      for(const r of v.recipe.filter(enabled)) {
        const s=stockById(r.stockId);
        if(!s||!s.roles.consume) return &#x27;Velg en hovedvare for alle aktive ingredienser.&#x27;;
        if(!units(s.dimension).includes(r.unit)) return &#x27;Forbruksenheten må passe til hovedvaren.&#x27;;
        if(!(num(r.amount)&gt;0)) return &#x27;Forbruk må være et tall større enn 0.&#x27;;
      }

    return &#x27;&#x27;;
