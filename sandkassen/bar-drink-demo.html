.form-check:not(.form-switch) .form-check-input[type="radio"]:disabled,

  border-color: #fff;

}

.form-range {

/* Web recipes are the default, including on renderers without inline style queries. */
@supports (border-radius: if(style(--corner-shape: round): 1px; else: 2px)) {
  /* Match the host's proportional text-sm scale at every text preference. */
  .tooltip,
  .viz-badge,
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    font-size: if(
      style(--corner-shape: round): round(
          nearest,
          calc(var(--font-size-base) * 14 / 16),
          1px
        );
        else: round(nearest, calc(var(--font-size-base) * 13 / 14), 1px)
    );
  }

  .btn,
  .nav-link,
  .form-select {
    border-radius: if(
      style(--corner-shape: round): var(--radius-full); else: var(--radius-lg)
    );
  }

  .form-check:not(.form-switch) .form-check-input[type="checkbox"] {
    border-radius: if(
      style(--corner-shape: round): calc(var(--radius-sm) / 2);
        else: calc(var(--radius-lg) * 0.4)
    );
  }

  .tooltip {
    font-weight: if(
      style(--corner-shape: round): 600; else: var(--font-weight-normal)

  }

    font-size: max(16px, calc(var(--font-size-base) * 14 / 16));

      16px,
      round(nearest, calc(var(--font-size-base) * 14 / 16), 1px)
    );
  }
  .form-control:is(
    [type="file"],
    [type="date"],
    [type="datetime-local"],
    [type="month"],
    [type="week"],
    [type="time"],
    [type="color"]
  ) {
    height: 44px;
    min-height: 44px;
    font-size: max(16px, calc(var(--font-size-base) * 14 / 16));
    font-size: max(
      16px,
      round(nearest, calc(var(--font-size-base) * 14 / 16), 1px)
    );
  }

  .form-control[type="file"]::file-selector-button {
    min-width: 44px;

  }

  .form-control-color[type="color"] {

  }

  .form-control:is(
    [type="date"],
    [type="datetime-local"],

    [type="time"],

  ) {

  }

  .form-check-input {

  }

  .form-check-input::after {
    position: absolute;

  const seeded = [
    ['gin-house','gin','Beefeater Gin',70,'cl',2100,280],

    ['tonic','tonic','Schweppes Tonic',100,'cl',5000,22],
    ['rum','rum','Bacardi Carta Blanca',70,'cl',1400,260],
    ['vodka','vodka','Absolut Vodka',null,'cl',null,null],
    ['soda','soda','Sodavann',100,'cl',4000,12],
    ['lemon','lemon','Sitronjuice',100,'cl',2000,42],
    ['syrup','syrup','Sukkerlake',100,'cl',2000,28],
    ['mint','mint','Mynteblad',100,'stk',200,45],
    ['prosecco','prosecco','Prosecco',75,'cl',3000,115],
    ['ginger','ginger','Ginger beer',20,'cl',2400,17],
    ['coffee','coffee','Espresso',100,'cl',0,60],
    ['cola','cola','Coca-Cola',150,'cl',3000,25],

  const clone = v => JSON.parse(JSON.stringify(v));

  const fmt = v => Number(v).toLocaleString('nb-NO',{maximumFractionDigits:2});
  const money = v => fmt(v)+' kr';

      'glass-water':'<path d="M5 3h14l-1.5 18h-11L5 3ZM6 12c3 2 9 2 12 0"/>',
      search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
      'arrow-right':'<path d="M5 12h14m-7-7 7 7-7 7"/>',
      plus:'<path d="M12 5v14M5 12h14"/>',
      'chevron-right':'<path d="m9 18 6-6-6-6"/>',

  };
  const button = (a,label,attrs='',kind='') => '<button type="button" class="dp-button cursor-interaction '+kind+'" data-action="'+a+'" '+attrs+'>'+label+'</button>';
  const input = (label,attrs,value='') => '<label class="dp-field"><span>'+label+'</span><input class="dp-input" '+attrs+' value="'+esc(value)+'"></label>';
  const check = (label,attrs,on) => '<label class="dp-check cursor-interaction"><input type="checkbox" '+attrs+(on?' checked':'')+'><span>'+label+'</span></label>';
  const units = dimension => dimension === 'count' ? ['stk'] : dimension === 'mass' ? ['g','kg'] : ['cl','ml','l'];
  const unitSelect = (dimension,current,attrs='') => '<select class="dp-select cursor-interaction" '+attrs+'>'+units(dimension).map(u=>'<option value="'+u+'"'+(u===current?' selected':'')+'>'+u+'</option>').join('')+'</select>';
  const state = {
    view:'library',step:1,selected:new Set(),search:'',category:'Alle',existingOnly:false,
    extras:{},mappings:{},house:{},prices:{},mapAll:false,importError:'',batches:[],result:null,
    mine:[],active:null,draft:null,variant:0,dirty:false,editorError:'',copying:false,variantAdding:false,
    stock:seeded.map(([id,key,name,pack,packUnit,balance,costPack])=>({
      id,key,name,dimension:defs[key].dimension,pack,packUnit,balance,costPack,
      inventoryActive:false,used:0,loss:id==='coffeeLiq'?2:id==='orangeLiq'?0.2:0,lossUnit:'cl',roles:{consume:true,sale:['gin-house','tonic'].includes(id)},
      sale:id==='gin-house'?{amount:4,unit:'cl',price:85,vat:25}:id==='tonic'?{amount:20,unit:'cl',price:45,vat:25}:null,
      revision:0,originImportId:null
    })),
    cart:[],sales:[],usageEvents:[],stockFilter:'all',itemEditing:null,itemError:'',receive:null,receiveError:'',preview:null,serial:0
  };

  const mineById = id => state.mine.find(d=>d.id===id);
  const packBase = s => s && Number.isFinite(s.pack) && s.pack>0 ? s.pack*factor(s.packUnit) : null;

  const usableBase = s => {const p=packBase(s);return p===null?null:Math.max(0,p-lossBase(s));};
  const displayUnit = s => s?.dimension==='count'?'stk':s?.dimension==='mass'?'g':'cl';
  const asDisplay = (base,s) => fmt(base/factor(displayUnit(s)))+' '+displayUnit(s);
  const lossText = s => lossBase(s)>0?fmt(num(s.loss))+' '+(s.lossUnit||s.packUnit||'cl'):'Ingen';
  const enabled = r => r.enabled !== false;
  const extras = d => (d.garnish || []).map(r=>({...r,optional:true,kind:r.key==='egg'?'Valgfri ingrediens':'Garnityr'}));
  const extraOn = (d,r) => state.extras[d.id+':'+r.key] === true;
  const selectedDrinks = () => catalog.filter(d=>state.selected.has(d.id)&&!state.mine.some(m=>m.sourceId===d.id));
  const chosenRecipe = d => d.recipe.concat(extras(d).filter(r=>extraOn(d,r)));
  const keys = () => [...new Set(selectedDrinks().flatMap(d=>chosenRecipe(d).map(r=>r.key)))];
  const stockCandidates = key => state.stock.filter(s=>s.key===key);
  const configNeeds = s => !s.roles.consume;
  function notify(message) {
    root.querySelector('#dp-notice').textContent=message;
    root.querySelector('#dp-live').textContent=message;
  }
  function icons() { if(typeof lucide!=='undefined') lucide.createIcons({attrs:{width:16,height:16}}); }
  function initMappings() {
    keys().forEach(key=>{
      if(state.mappings[key] && (state.mappings[key].id==='__new__'||stockById(state.mappings[key].id)||state.mappings[key].id==='')) return;
      const candidates=stockCandidates(key);
      const house=stockById(state.house[key]);
      state.mappings[key]={
        id:house?house.id:candidates.length===1?candidates[0].id:candidates.length?'':'__new__',
        reason:house?'Husets standard':candidates.length===1?'Koblet automatisk til eksisterende vare':'',
        remember:true,decision:null,accepted:false,

  function mapReady(key) {

  function inventoryLabel(s) {

  const roleLabel = s => s.roles.sale && s.roles.consume ? 'Salg og forbruk' : s.roles.sale ? 'Salg' : 'Forbruk';
  function configuredStock(key) {
    const m=state.mappings[key];
    if(!m) return null;

  function costing(recipe,price,vat=25,resolver=stockById) {
    let cost=0; const missing=[];
    recipe.filter(enabled).forEach(r=>{
      const s=resolver(r.stockId || r.key);
      if(!s||!usableBase(s)||s.costPack===null||!Number.isFinite(s.costPack)||!Number.isFinite(num(r.amount))) {

    });
    const net=num(price)/(1+num(vat)/100);

  }
  function economics(recipe,price,vat=25,resolver=stockById) {
    const c=costing(recipe,price,vat,resolver);

  function importDrinks() {
    const drinks=selectedDrinks(); if(!drinks.length) return;
    if(keys().some(k=>!mapReady(k))) {state.step=2;state.importError='Avklar varene før import.';render();return;}
    if(drinks.some(d=>!(num(state.prices[d.id]??d.price)>0))) {state.importError='Legg inn en salgspris større enn 0.';render();return;}
    for(const k of keys()) {
      const m=state.mappings[k];
      if(m.id==='__new__'&&validateMapDraft(m)) {state.importError=validateMapDraft(m);state.step=2;render();return;}
    }
    const batch={id:uid('import'),createdDrinks:[],createdStocks:[],configured:[],reused:0,count:drinks.length,undone:false};
    const linked={};
    keys().forEach(k=>{
      const m=state.mappings[k]; let s;
      if(m.id==='__new__') {
        s={id:uid('stock'),key:k,dimension:defs[k].dimension,name:m.draft.name.trim(),pack:null,packUnit:m.draft.packUnit,costPack:null,loss:0,lossUnit:defs[k].dimension==='count'?'stk':'cl',inventoryActive:false,balance:null,used:0,roles:{consume:true,sale:false},sale:null,revision:0,originImportId:batch.id};
        state.stock.push(s); batch.createdStocks.push({id:s.id,revision:s.revision});
      } else {
        s=stockById(m.id); batch.reused++;
        if(m.decision==='configure') {
          const before=clone(s);
          Object.assign(s,{name:m.draft.name.trim(),pack:num(m.draft.pack),packUnit:m.draft.packUnit,costPack:optionalNum(m.draft.costPack),inventoryActive:m.draft.inventoryActive,roles:{...s.roles,consume:true},revision:s.revision+1});
          batch.configured.push({id:s.id,before,afterRevision:s.revision});
        }
      }
      linked[k]=s.id;
      if(m.remember && s) state.house[k]=s.id;
    });
    drinks.forEach(d=>{
      const recipe=d.recipe.map(r=>({...r,stockId:linked[r.key],enabled:true}));
      extras(d).forEach(r=>recipe.push({...r,stockId:linked[r.key]||stockCandidates(r.key).find(s=>s.roles.consume)?.id||null,enabled:extraOn(d,r)}));
      const local={id:uid('drink'),sourceId:d.id,name:d.name,category:d.category,alcoholFree:d.category==='Alkoholfrie',vat:25,version:1,revision:0,originImportId:batch.id,variants:[{id:uid('variant'),label:'Standard',price:num(state.prices[d.id]??d.price),recipe}]};
      state.mine.push(local);batch.createdDrinks.push({id:local.id,revision:local.revision});
    });

    selectMine(batch.createdDrinks[0].id);

  function undoReason(batch) {
    if(!batch||batch.undone) return 'Importen er allerede angret.';
    const ids=batch.createdDrinks.map(x=>x.id),stockIds=batch.createdStocks.map(x=>x.id);
    if(state.sales.some(s=>s.lines.some(l=>ids.includes(l.drinkId)||l.recipe.some(r=>stockIds.includes(r.stockId))))) return 'Importen har registrerte salg. Historikk og forbruk beholdes.';
    if(state.cart.some(l=>ids.includes(l.drinkId)||l.recipe.some(r=>stockIds.includes(r.stockId)))) return 'Tøm handlekurven før du angrer importen.';
    if(batch.createdDrinks.some(x=>!mineById(x.id)||mineById(x.id).revision!==x.revision)) return 'En importert drink er endret. Importen kan ikke angres samlet.';
    if(state.mine.some(d=>!ids.includes(d.id)&&(ids.includes(d.copyOf)||d.variants.some(v=>v.recipe.some(r=>stockIds.includes(r.stockId)))))) return 'En annen drink bruker varer eller oppskrifter fra importen.';
    if(batch.createdStocks.some(x=>!stockById(x.id)||stockById(x.id).revision!==x.revision)) return 'En ny forbruksvare er endret eller har fått varemottak.';
    if(batch.configured.some(x=>stockById(x.id)?.revision!==x.afterRevision)) return 'Et vareoppsett fra importen er endret i etterkant.';
    if(state.mine.some(d=>!ids.includes(d.id)&&d.variants.some(v=>v.recipe.some(r=>batch.configured.some(x=>x.id===r.stockId))))) return 'En annen drink bruker et vareoppsett som ble endret ved importen.';
    if(state.dirty&&ids.includes(state.active)) return 'Lagre eller forkast oppskriftsendringene før du angrer.';
    return '';
  }
  function undoImport() {
    const b=state.batches.find(b=>b.id===state.result),reason=undoReason(b);
    if(reason) {notify(reason);return;}
    const ids=b.createdDrinks.map(x=>x.id),stockIds=b.createdStocks.map(x=>x.id);
    state.mine=state.mine.filter(d=>!ids.includes(d.id));state.stock=state.stock.filter(s=>!stockIds.includes(s.id));
    b.configured.forEach(x=>{const i=state.stock.findIndex(s=>s.id===x.id);state.stock[i]=clone(x.before);});
    Object.keys(state.house).forEach(k=>{if(stockIds.includes(state.house[k])) delete state.house[k];});
    b.undone=true;state.active=null;state.draft=null;state.dirty=false;state.result=null;
    if(state.mine.length) selectMine(state.mine[0].id);
    notify('Importen er angret. Eksisterende varer er beholdt.');render();
  }

  function validateDrink(d) {
    if(!d.name.trim()) return 'Drinken må ha et navn.';
    if(!Number.isFinite(num(d.vat))||num(d.vat)<0||num(d.vat)>100) return 'Mva. må være mellom 0 og 100 %.';
    const labels=new Set();
    for(const v of d.variants) {
      if(!v.label.trim()) return 'Hver variant må ha et navn.';
      if(labels.has(v.label.trim().toLowerCase())) return 'Variantene må ha ulike navn.';
      labels.add(v.label.trim().toLowerCase());
      if(!(num(v.price)>0)) return 'Salgsprisen må være større enn 0.';
      if(!v.recipe.some(enabled)) return 'Hver variant må ha minst én ingrediens.';
      for(const r of v.recipe.filter(enabled)) {
        const s=stockById(r.stockId);
        if(!s||!s.roles.consume) return 'Velg en ingrediens for alle aktive linjer.';
        if(!units(s.dimension).includes(r.unit)) return 'Forbruksenheten må passe til hovedvaren.';
        if(!(num(r.amount)>0)) return 'Forbruk må være et tall større enn 0.';
      }
    }
    return '';
  }

  function addCart(drinkId,variantId,stockId=null) {

      line={key:'stock:'+s.id,name:s.name,drinkId:null,stockProductId:s.id,variantId:null,label:fmt(s.sale.amount)+' '+s.sale.unit,version:null,price:s.sale.price,vat:s.sale.vat,recipe:[{stockId:s.id,key:s.key,amount:s.sale.amount,unit:s.sale.unit,enabled:true}],qty:1};
    } else {
      const d=mineById(drinkId),v=d?.variants.find(v=>v.id===variantId); if(!v) return;
      line={key:d.id+':'+v.id+':'+d.version,name:d.name,drinkId:d.id,stockProductId:null,variantId:v.id,label:v.label,version:d.version,price:v.price,vat:d.vat,recipe:clone(v.recipe.filter(enabled)),qty:1,alcoholFree:d.alcoholFree};
    }

  function consumption(lines) {
    const totals=new Map();

      const amount=num(r.amount)*factor(r.unit)*l.qty;
      totals.set(r.stockId,(totals.get(r.stockId)||0)+amount);

    return [...totals].map(([stockId,base])=>({stockId,base}));

  function completeSale() {
    if(!state.cart.length)return;
    const amounts=consumption(state.cart);
    if(amounts.some(r=>!stockById(r.stockId)||!Number.isFinite(r.base)||r.base<=0)) {notify('Salget har en ugyldig ingrediens eller mengde.');return;}
    const sale={id:uid('sale'),number:state.sales.length+1,lines:clone(state.cart),refunded:false,createdAt:new Date().toISOString()};
    const events=[];
    sale.lines.forEach((line,i)=>line.recipe.filter(enabled).forEach(r=>{
      const s=stockById(r.stockId);if(!s)return;
      events.push({id:uid('usage'),saleId:sale.id,orderLine:i,stockId:s.id,base:num(r.amount)*factor(r.unit)*line.qty,recipeVersion:line.version,occurredAt:sale.createdAt,source:'sale'});
    }));
    events.forEach(ev=>{stockById(ev.stockId).used+=ev.base;stockById(ev.stockId).revision++;});
    state.usageEvents.push(...events);state.sales.push(sale);state.cart=[];
    notify('Testsalget er registrert. Forbruket er dokumentert, uten lagertrekk.');render();
  }

  function updateLossPreview(){
    const d=state.itemEditing,p=optionalNum(d?.pack),l=optionalNum(d?.loss)??0,box=root.querySelector('#dp-loss-preview');if(!box)return;
    if(p===null){box.textContent='Oppgi pakningsstørrelse for å se tilgjengelig mengde.';return;}
    const full=p*factor(d.packUnit),rest=l*factor(d.lossUnit);
    box.textContent=!(p>0)||!(l>=0)||rest>=full?'Fast rest må være mindre enn innholdet i pakningen.':'Av '+fmt(p)+' '+d.packUnit+' er '+asDisplay(full-rest,d)+' tilgjengelig. '+(rest>0?asDisplay(rest,d)+' blir igjen som fast rest.':'Ingen fast rest.');
  }
  function saveItem() {
    const d=clone(state.itemEditing);
    const cost=optionalNum(d.costPack),pack=optionalNum(d.pack),loss=optionalNum(d.loss)??0;
    let error='';
    if(!d.name.trim()) error='Varen må ha et navn.';
    else if(pack!==null&&(!Number.isFinite(pack)||pack<=0)) error='Pakningsstørrelse må være større enn 0.';
    else if(cost!==null&&(!Number.isFinite(cost)||cost<0)) error='Kostpris må være 0 eller et positivt tall.';
    else if(!Number.isFinite(loss)||loss<0) error='Fast rest må være 0 eller et positivt tall.';
    else if(loss>0&&pack===null) error='Oppgi pakningsstørrelse for å registrere fast rest.';
    else if(pack!==null&&loss*factor(d.lossUnit||d.packUnit)>=pack*factor(d.packUnit)) error='Fast rest må være mindre enn innholdet i pakningen.';
    else if(!d.roles.consume&&!d.roles.sale) error='Velg minst én rolle for varen.';
    else if(d.roles.sale&&(!(num(d.sale.amount)>0)||!(num(d.sale.price)>0)||!units(d.dimension).includes(d.sale.unit)||!Number.isFinite(num(d.sale.vat))||num(d.sale.vat)<0||num(d.sale.vat)>100)) error='Fyll ut gyldig mengde, pris og mva. for salgsvaren.';
    if(error) {state.itemError=error;render();return;}
    d.name=d.name.trim();d.pack=pack;d.costPack=cost;d.loss=loss;
    if(d.roles.sale) {d.sale.amount=num(d.sale.amount);d.sale.price=num(d.sale.price);d.sale.vat=num(d.sale.vat);} else d.sale=null;
    if(d.id) {d.revision++;state.stock[state.stock.findIndex(s=>s.id===d.id)]=d;}
    else {d.id=uid('stock');d.key=uid('custom');d.originImportId=null;state.stock.push(d);}
    state.itemEditing=null;state.itemError='';notify('Vareoppsettet er lagret.');render();
  }
  function receiveStock(id) {
    const s=stockById(id),qty=num(root.querySelector('[data-receive-qty]')?.value);
    if(!s||!packBase(s)||!s.inventoryActive) return;
    if(!Number.isFinite(qty)||qty<0||(s.balance!==null&&qty===0)) {
      state.receiveError=s.balance===null?'Legg inn 0 eller et positivt antall pakninger.':'Legg inn et positivt antall pakninger.';render();return;

    if(s.balance===null) s.balance=qty*packBase(s);else s.balance+=qty*packBase(s);
    s.revision++;state.receive=null;state.receiveError='';notify('Beholdningen er oppdatert.');render();
  }

    'cancel-receive':()=>{state.receive=null;state.receiveError='';render();},
    'save-receive':b=>receiveStock(b.dataset.id),
    'preview':b=>preview(b.dataset.id),
    'close-preview':()=>{state.preview=null;render();},
    'preview-select':b=>{const id=b.dataset.id;if(state.selected.has(id))state.selected.delete(id);else state.selected.add(id);state.preview=null;render();}
  };
  function acceptMap(key) {
    const m=state.mappings[key],error=validateMapDraft(m);
    if(error){state.importError=error;render();return;}
    m.accepted=true;state.importError='';notify(defs[key].name+' er avklart.');render();
  }
  root.addEventListener('click',e=>{
    const nav=e.target.closest('[data-nav]');
    if(nav){state.view=nav.dataset.nav;state.preview=null;state.itemEditing=null;render();return;}
    const action=e.target.closest('[data-action]');
    if(action&&!action.disabled){const handler=actions[action.dataset.action];if(handler)handler(action);return;}
    const card=e.target.closest('[data-card]');
    if(card&&!e.target.closest('input,label,button')) {
      const cb=card.querySelector('[data-select]');
      if(cb&&!cb.disabled){cb.checked=!cb.checked;cb.dispatchEvent(new Event('change',{bubbles:true}));}
    }
  });
  root.addEventListener('input',e=>{
    const el=e.target,ds=el.dataset;
    if('search' in ds) {
      const start=el.selectionStart,end=el.selectionEnd;state.search=el.value;render();
      const field=root.querySelector('[data-search]');field.focus();field.setSelectionRange(start,end);return;
    }
    if('importPrice' in ds){state.prices[ds.importPrice]=el.value;return;}
    if('mapField' in ds&&el.tagName==='INPUT') {const m=state.mappings[ds.key];m.draft[ds.mapField]=el.value;m.accepted=false;return;}
    if('draft' in ds){state.draft[ds.draft]=el.value;draftChanged();return;}
    if('variantField' in ds){state.draft.variants[state.variant][ds.variantField]=el.value;draftChanged();return;}
    if('recipeAmount' in ds){state.draft.variants[state.variant].recipe[Number(ds.recipeAmount)].amount=el.value;draftChanged();return;}
    if('itemField' in ds&&el.tagName==='INPUT'){state.itemEditing[ds.itemField]=el.value;updateLossPreview();return;}
    if('itemSale' in ds&&el.tagName==='INPUT'){state.itemEditing.sale[ds.itemSale]=el.value;}
  });
  root.addEventListener('change',e=>{
    const el=e.target,ds=el.dataset;
    if('select' in ds){if(el.checked)state.selected.add(ds.select);else state.selected.delete(ds.select);render();return;}
    if('category' in ds){state.category=el.value;render();return;}
    if('existing' in ds){state.existingOnly=el.checked;render();return;}
    if('extra' in ds){state.extras[ds.extra]=el.checked;if(state.preview)preview(state.preview);else render();return;}
    if('map' in ds){const m=state.mappings[ds.map];m.id=el.value;m.reason='Ditt valg';m.decision=null;m.accepted=false;state.importError='';render();return;}
    if('remember' in ds){state.mappings[ds.remember].remember=el.checked;return;}
    if('mapCheck' in ds){const m=state.mappings[ds.key];m.draft[ds.mapCheck]=el.checked;m.accepted=false;return;}
    if('mapField' in ds){const m=state.mappings[ds.key];m.draft[ds.mapField]=el.value;m.accepted=false;return;}
    if('draftCheck' in ds){state.draft[ds.draftCheck]=el.checked;draftChanged();return;}
    if('recipeCheck' in ds){
      const r=state.draft.variants[state.variant].recipe[Number(ds.recipeCheck)];r.enabled=el.checked;
      if(el.checked&&!stockById(r.stockId)&&defs[r.key]){
        let s=stockCandidates(r.key)[0];
        if(!s){s={id:uid('stock'),key:r.key,name:defs[r.key].name,dimension:defs[r.key].dimension,pack:null,packUnit:defs[r.key].packUnit,costPack:null,loss:0,lossUnit:displayUnit(defs[r.key]),inventoryActive:false,balance:null,used:0,roles:{consume:true,sale:false},sale:null,revision:0,originImportId:null};state.stock.push(s);}
        r.stockId=s.id;
      }draftChanged(true);return;
    }
    if('recipeStock' in ds) {
      const r=state.draft.variants[state.variant].recipe[Number(ds.recipeStock)],s=stockById(el.value);
      r.stockId=el.value||null;if(s){r.key=s.key;if(!units(s.dimension).includes(r.unit)){r.unit=units(s.dimension)[0];r.amount=1;}}draftChanged(true);return;
    }
    if('recipeUnit' in ds) {
      const r=state.draft.variants[state.variant].recipe[Number(ds.recipeUnit)];
      const value=num(r.amount);if(Number.isFinite(value))r.amount=value*factor(r.unit)/factor(el.value);
      r.unit=el.value;draftChanged(true);return;
    }
    if('stockFilter' in ds){state.stockFilter=el.value;state.receive=null;render();return;}
    if('mineSelect' in ds){if(state.dirty&&el.value!==state.active){el.value=state.active;notify('Lagre eller forkast endringene før du velger en annen drink.');return;}selectMine(el.value);render();return;}
    if('itemCheck' in ds){state.itemEditing[ds.itemCheck]=el.checked;return;}
    if('itemRole' in ds){state.itemEditing.roles[ds.itemRole]=el.checked;render();return;}
    if('itemDimension' in ds){const s=state.itemEditing;s.dimension=el.value;s.packUnit=units(s.dimension)[0];s.lossUnit=s.packUnit;s.loss=0;s.sale.unit=s.packUnit;s.sale.amount=1;render();return;}
    if('itemField' in ds){state.itemEditing[ds.itemField]=el.value;updateLossPreview();return;}
    if('itemSale' in ds){state.itemEditing.sale[ds.itemSale]=el.value;}
  });
  render();
})();


</script>
</body></html>
